[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "framekind"
version = "0.1.0"
description = "Accessibility QC agent for film and TV deliverables (captions, SDH, audio description)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kumar Abhinav" }]

dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "srt>=3.5.3",
    "webvtt-py>=0.4.6",
    "jinja2>=3.1.3",
    "google-genai>=0.1.1",
    "google-adk>=0.1.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-speech>=2.25.0",
    "google-cloud-aiplatform>=1.44.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "agents*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
